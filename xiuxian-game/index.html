function authoredEncounter(entry,g){
 const [title,text,theme,item]=entry,bonus=8+g*5,price=10+g*12,needWis=38+g*7,needBody=36+g*8;
 const give=(base)=>item?Object.assign({},base,{item}):base;
 let choices;
 if(theme==='trade')choices=[give({t:'压低价格后买下',ok:x=>x.stone>=price,h:`需要灵石≥${price}`,e:{life:-1,stone:-price,wis:1,luck:1}}),{t:'只套取情报，不急着出手',e:{life:-1,wis:2,dao:1}}];
 else if(theme==='auction')choices=[give({t:'参与竞价',ok:x=>x.stone>=price+10,h:`需要灵石≥${price+10}`,e:{life:-2,stone:-(price+10),rep:1}}),{t:'只观察竞价者',e:{life:-1,wis:3,dao:1}}];
 else if(theme==='herb')choices=[give({t:'冒险采下或收走',e:{life:-3,cult:R(bonus,bonus+8),hp:-R(0,5),wis:1}}),{t:'记下位置，等待更稳妥时机',e:{life:-1,dao:2,wis:2}}];
 else if(theme==='loot')choices=[give({t:'先布置退路，再取遗物',e:{life:-2,stone:R(6+g*5,18+g*9),wis:2,hp:-R(0,4)}}),{t:'不碰无主之物',e:{life:-1,dao:3,luck:1}}];
 else if(theme==='ambush')choices=[give({t:'反设埋伏',ok:x=>x.body>=needBody,h:`需要体魄≥${needBody}`,e:{life:-4,cult:R(bonus+4,bonus+14),stone:R(8+g*5,22+g*9),hp:-R(2,8+g)}}),{t:'立刻遁走，不赌对方底牌',e:{life:-2,dao:2,wis:2}}];
 else if(theme==='combat'||theme==='war')choices=[give({t:'衡量胜算后出手',ok:x=>x.body>=needBody,h:`需要体魄≥${needBody}`,e:{life:-4,cult:R(bonus+5,bonus+16),rep:2+g,hp:-R(2,9+g)}}),{t:'保存实力，绕开正面冲突',e:{life:-2,dao:2,wis:1}}];
 else if(theme==='craft'||theme==='formation')choices=[give({t:'拆解结构仔细研究',ok:x=>x.wis>=needWis,h:`需要悟性≥${needWis}`,e:{life:-3,wis:3,cult:R(bonus,bonus+9)}}),{t:'记录纹路后离开',e:{life:-1,wis:2,dao:1}}];
 else if(theme==='teleport')choices=[give({t:'尝试补全阵纹',ok:x=>x.wis>=needWis,h:`需要悟性≥${needWis}`,e:{life:-4,wis:3,cult:R(bonus+3,bonus+13),hp:-R(0,5)}}),{t:'只拓印阵纹',e:{life:-2,wis:3,dao:2}}];

function resolve(c){let logs=[];for(const[k,v]of Object.entries(c.e||{})){s[k]=(s[k]||0)+v;logs.push([`${({life:'寿命',cult:'修为',hp:'健康',dao:'道心',stone:'灵石',rep:'声望',body:'体魄',wis:'悟性',luck:'气运'})[k]||k} ${v>=0?'+':''}${v}`,v<0?'bad':''])}if(c.item){addItem(c.item);logs.push([`获得：${c.item}`,'special'])}if(c.consume&&delItem(c.consume))logs.push([`消耗：${c.consume}`,'bad']);if(c.set)Object.assign(s.flags,c.set);if(c.npc){s.npcs[c.npc[0]]=(s.npcs[c.npc[0]]||0)+c.npc[1];logs.push([`${c.npc[0]}关系 +${c.npc[1]}`,'special'])}if(c.ach)unlock(c.ach,logs);s.turn++;let cost=-(c.e?.life||0);s.age+=Math.max(cost,1);s.hp=C(s.hp,0,100);s.dao=C(s.dao,0,100);s.hist.push([s.age,`${$('panelTitle').textContent}：${c.t}`]);checkAch(logs);showLogs(logs);if(!checkEnd())save(1)}
function showLogs(ls){$('event').classList.add('hidden');$('logs').classList.remove('hidden');$('logs').innerHTML=ls.map(x=>`<div class="delta ${x[1]}">${x[0]}</div>`).join('')+`<button id="next" class="btn primary">继续前行</button>`;$('next').onclick=()=>{render();scene('修仙纪事','仙途未尽',`如今你已在${groupNames[grp()]}境，天地间可触及的因果与往日不同。`)}}
function breakthrough(){let r=realm();if(s.realm>=12)return end('已臻化神');if(s.cult<r[1])return toast(`修为不足，还需${r[1]-s.cult}`);s.turn++;let bonus=0,logs=[];if(has('灵泉玉瓶')){delItem('灵泉玉瓶');bonus+=10;logs.push(['灵泉玉瓶：破境 +10%','special'])}if(s.realm===2&&has('筑基丹')){delItem('筑基丹');bonus+=18;logs.push(['筑基丹：筑基 +18%','special'])}if(s.realm===8&&has('结婴心得')){delItem('结婴心得');bonus+=16;logs.push(['结婴心得：结婴 +16%','special'])}if(s.realm===11&&has('化神残简')){delItem('化神残简');bonus+=14;logs.push(['化神残简：化神 +14%','special'])}if(has('护法傀儡')){bonus+=6;logs.push(['护法傀儡：护法 +6%','special'])}let chance=C(58+Math.floor(s.dao/8)+Math.floor(s.wis/12)+mod('br')+bonus-s.realm*2,25,94),oldGroup=grp(),target=realms[s.realm+1][0];scene('破境天劫','雷云压顶',`你燃尽积累冲击${target}，成功率约 ${chance}%。`);if(R(1,100)<=chance){s.realm++;s.stats.bs++;s.cult=0;s.dao=C(s.dao+4,0,100);s.hp=C(s.hp+12,0,100);logs.push([`突破成功：${realm()[0]}`,'special']);if(grp()>oldGroup){let gain=realm()[2]-s.max;s.max=realm()[2];s.life+=gain;logs.push([`大境界跃迁：寿命上限 +${gain}`,'special']);s.hist.push([s.age,`踏入${groupNames[grp()]}境，旧日事件逐渐退场，新的事件池已开启。`])}else{s.life-=4;s.age+=4}if(s.realm===12){save(1);return end('化神飞升')}}else{s.stats.bf++;let loss=R(10,20);s.life-=loss;s.age+=loss;s.hp-=R(8,18);s.cult=Math.floor(s.cult*.55);logs.push(['突破失败，灵气反噬','bad'],[`寿命 -${loss}`,'bad'])}s.hist.push([s.age,logs.find(x=>x[0].includes('突破'))?.[0]||'破境']);checkAch(logs);showLogs(logs);if(!checkEnd())save(1)}
function unlock(a,logs=[]){if(s.achs.includes(a))return;s.achs.push(a);logs.push([`解锁成就：${a}`,'special']);let m=meta();if(!m.achs.includes(a))m.achs.push(a);setMeta(m)}function checkAch(l){if(s.realm>=3)unlock('初窥仙途',l);if(s.realm>=6)unlock('金丹大道',l);if(s.realm>=9)unlock('元婴老怪',l);if(s.realm>=12)unlock('一朝化神',l);if(s.stats.bf>=3)unlock('九死一生',l);if(s.tal.some(t=>t[1]==='神品'))unlock('绝世妖孽',l)}function checkEnd(){if(s.hp<=0)return end('伤重坐化'),1;if(s.life<=0){if(s.flags.rebirth&&!s.flags.used){s.flags.used=1;s.stone=0;s.life=20;s.hp=45;toast('轮回之主逆转死劫');return 0}return end('寿元耗尽'),1}return 0}
function title(reason){if(s.realm>=12)return s.flags.changed?'逆命天尊':s.flags.sword_tomb?'万剑尊者':s.flags.soul_heritage?'古魂道君':'一朝化神';if(s.flags.oversea_route&&s.realm>=9)return'海外道君';if(s.flags.insect_swarm&&s.realm>=9)return'万虫真君';if(s.flags.sect_war&&s.realm>=9)return'宗门太上';if(s.flags.five_awake)return'五行真人';if(s.flags.fox_realm)return'狐族故人';if(s.realm>=9)return'一方老祖';if(s.realm>=6)return'金丹真人';return reason==='寿元耗尽'?'寿终道止':'身死道消'}function end(reason){if(s.ended&&s._reported)return; s.ended=true;s.reason=reason;s._reported=true;save(1);let t=title(reason),m=meta();m.runs++;m.best=Math.max(m.best,s.realm);if(!m.ends.includes(t))m.ends.push(t);setMeta(m);sheet('修仙生涯报告',`<div class="report"><small>修仙生涯录</small><h2>${s.name}</h2><b>${t} · ${reason}</b><div class="rgrid" style="margin-top:15px"><div>最终境界<br><b>${realm()[0]}</b></div><div>最终年龄<br><b>${s.age}岁</b></div><div>行动次数<br><b>${s.turn}</b></div><div>不同事件<br><b>${Object.keys(s.eventCounts).length}</b></div></div><p>重要因果：${Object.keys(s.flags).filter(k=>!k.startsWith('done_')&&s.flags[k]).slice(0,8).join('、')||'平淡无波'}<br>成就：${s.achs.join('、')||'无'}</p></div><button id="again" class="btn primary" style="width:100%;margin-top:12px">再活一世</button>`);setTimeout(()=>$('again').onclick=()=>{close();s=fresh();save(1);openGame()},0)}
function itemAction(i){let logs=[];if(i==='延寿果'){delItem(i);s.life+=50;s.max+=20;logs.push(['服下延寿果：寿命 +50，上限 +20','special'])}else if(i==='妖丹'){delItem(i);s.cult+=15;s.hp=C(s.hp-2,0,100);logs.push(['炼化妖丹：修为 +15，健康 -2','special'])}else if(i==='妖兽精血'){delItem(i);s.body+=3;s.hp=C(s.hp-4,0,100);logs.push(['妖血淬体：体魄 +3，健康 -4','special'])}else if(i==='千年灵草'){delItem(i);s.life+=30;s.hp=C(s.hp+15,0,100);logs.push(['服下千年灵草：寿命 +30，健康 +15','special'])}else if(i==='遁行符'){delItem(i);s.luck+=3;s.dao+=2;logs.push(['炼化遁行符心得：气运 +3，道心 +2','special'])}else return toast('这是剧情线索或被动道具，会在满足条件时自动开启后续事件');s.hist.push([s.age,`使用道具：${i}`]);save(1);close();render();toast(logs[0][0])}
function sheet(t,h){$('sheetTitle').textContent=t;$('sheetBody').innerHTML=h;$('overlay').classList.remove('hidden')}function close(){$('overlay').classList.add('hidden')}function view(v){if(v==='history')sheet('此世历程',`<div class="list">${s.hist.slice().reverse().map(x=>`<div class="item"><small>${x[0]}岁</small><br>${x[1]}</div>`).join('')}</div>`);if(v==='stats')sheet('角色命盘',`<div class="list"><div class="item"><b>${s.name}</b><br><small>${s.origin} · ${s.root} · ${realm()[0]}</small></div>${[['寿命',`${s.life}/${s.max}`],['修为',`${s.cult}/${realm()[1]}`],['健康',s.hp],['道心',s.dao],['体魄',s.body],['悟性',s.wis],['气运',s.luck],['灵石',s.stone],['声望',s.rep],['已见不同事件',Object.keys(s.eventCounts).length]].map(x=>`<div class="item">${x[0]}：<b>${x[1]}</b></div>`).join('')}</div>`);if(v==='bag'){let keys=Object.keys(s.items);sheet('乾坤袋',keys.length?`<div class="list">${keys.map(i=>`<div class="item"><b>${i} ×${s.items[i]}</b><br><small>${itemInfo[i]||'修仙物品'}</small><br><button class="btn" data-use="${i}" style="margin-top:8px">使用 / 查看因果</button></div>`).join('')}</div>`:'<div class="item">空空如也</div>')}if(v==='ach')sheet('成就道印',`<div class="list">${['初窥仙途','金丹大道','元婴老怪','一朝化神','逆天改命','九死一生','绝世妖孽','残魂传承','古修洞府','万剑问心','五行归一','狐族故人','宗门柱石','灵药自给','谨慎夺宝','旧修遗藏','古阵行者','海外散修','驭虫初成','虫群之主','傀儡护道','战场拾荒者','黑市常客','丹火自成'].map(x=>`<div class="item" style="opacity:${s.achs.includes(x)?1:.4}">${s.achs.includes(x)?'◆':'◇'} ${x}</div>`).join('')}</div>`)}function codex(){let m=meta();sheet('轮回图鉴',`<div class="list"><div class="item">已完成轮回 <b>${m.runs}</b> 次<br><small>最高境界：${realms[m.best][0]}</small></div><div class="item"><b>永久成就</b><br><small>${m.achs.join('、')||'尚未解锁'}</small></div><div class="item"><b>结局图鉴</b><br><small>${m.ends.join('、')||'尚未解锁'}</small></div></div>`)}
function openGame(){$('home').classList.add('hidden');$('game').classList.remove('hidden');render();scene('修仙纪事',`当前：${groupNames[grp()]}境`,`${groupNames[grp()]}境奇遇采用硬去重：同一奇遇不会再次出现，人工编写的原创“凡人流”事件优先出现，且每个事件只出现一次；耗尽后再进入动态奇缘池。`)}$('new').onclick=()=>{s=fresh();save(1);openGame()};$('cont').onclick=()=>{s=migrate(JSON.parse(localStorage.getItem(SK)));openGame();if(s.ended&&!s._reported)end(s.reason)};$('codex').onclick=codex;$('save').onclick=()=>save();$('menu').onclick=()=>sheet('游戏菜单','<button id="homeBtn" class="btn" style="width:100%">返回首页</button><button id="endBtn" class="btn" style="width:100%;margin-top:8px">结束本局</button>');$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.addEventListener('click',e=>{if(e.target.id==='homeBtn'){close();$('game').classList.add('hidden');$('home').classList.remove('hidden')}if(e.target.id==='endBtn'){close();end('主动结束此世')}if(e.target.dataset?.use)itemAction(e.target.dataset.use)});
if(!localStorage.getItem(SK)&&localStorage.getItem(V2)){try{localStorage.setItem(SK,JSON.stringify(migrate(JSON.parse(localStorage.getItem(V2)))))}catch{}}$('cont').classList.toggle('hidden',!localStorage.getItem(SK));})();
</script></body></html>
