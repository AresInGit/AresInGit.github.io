ction ev(title,text,choices){$('panelTitle').textContent=title;$('actions').classList.add('hidden');$('event').classList.remove('hidden');$('event').innerHTML=`<p style="line-height:1.7;color:#d9d2c3">${text}</p><div class="choices">${choices.map((c,i)=>`<button class="choice" data-c="${i}" ${c.ok&&!c.ok(s)?'disabled':''}><strong>${c.t}</strong><small>${c.h||''}</small></button>`).join('')}</div>`;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>resolve(choices[+b.dataset.c]))}function pickEvent(action,pool){let all=pool.filter(e=>!e.when||e.when(s)),recent=s.recentEvents||(s.recentEvents=[]),ban=new Set(recent.slice(-3)),cand=all.filter(e=>!ban.has(e.id));if(!cand.length)cand=all;let total=cand.reduce((n,e)=>n+(e.w||1),0),x=Math.random()*total,chosen=cand[0];for(const e of cand){x-=e.w||1;if(x<=0){chosen=e;break}}recent.push(chosen.id);if(recent.length>8)recent.splice(0,recent.length-8);return chosen.make()}function act(a){if(a==='break')return breakthrough();s.stat[a]++;let pools={train:[{id:'train_qi',make:()=>({title:'吐纳周天',text:'灵气沿经脉缓缓流转，你察觉丹田中的壁障松动了一丝。',choices:[{t:'稳扎稳打',e:{life:-2,cult:R(8,13)+mod('cult'),dao:2}},{t:'强行运转大周天',ok:x=>x.hp>=45,h:'需要健康≥45',e:{life:-4,cult:R(15,23)+mod('cult'),hp:-6}}]})},{id:'train_pine',make:()=>({title:'古松悟道',text:'山巅古松经雷火而不死，你静坐树下，忽有所悟。',choices:[{t:'观松悟势',e:{life:-3,cult:R(9,15)+mod('cult'),dao:4}},{t:'借雷痕淬体',ok:x=>x.body>=35,h:'需要体魄≥35',e:{life:-3,cult:R(7,12),body:2,hp:-R(1,5)}}]})},{id:'train_alchemy',make:()=>({title:'丹室借火',text:'废弃丹室中尚有地火余温，墙上留着前人炼气心得。',choices:[{t:'借火炼气',e:{life:-2,cult:R(10,16)+mod('cult'),hp:-R(0,3)}},{t:'抄录丹诀',e:{life:-2,wis:2,cult:R(5,9)},item:'残缺丹诀'}]})},{id:'train_sword',make:()=>({title:'剑坪听风',text:'旧剑坪上风声如剑鸣，一招一式仿佛藏在风里。',choices:[{t:'随风演剑',e:{life:-3,cult:R(8,14)+mod('cult'),body:2}},{t:'闭目听剑',e:{life:-2,dao:3,wis:2}}]})},{id:'train_stars',make:()=>({title:'夜观星河',text:'今夜群星异常明亮，你在星辉下推演自身修行之路。',choices:[{t:'推演功法',e:{life:-2,cult:R(7,12)+mod('cult'),wis:3}},{t:'静守本心',e:{life:-2,dao 古篆',ok:x=>x.wis>=40,h:'需要悟性≥40',e:{life:-3,wis:3,cult:R(12,20)}},{t:'以神识触碑',e:{life:-4,dao:R(-3,5),cult:R(8,22),hp:-R(0,6)}}]})},{id:'enc_clock',w:4,when:x=>!x.flags.changed&&(x.life<20||x.flags.short)&&(x.luck>=35),make:()=>({title:'逆命古钟',text:'古钟无风自鸣，钟声仿佛正在丈量你剩余的寿元。',choices:[{t:'以道心叩钟',ok:x=>x.dao>=60,h:'需要道心≥60',e:{life:45,dao:-8},flag:'changed'},{t:'以灵石祭钟',ok:x=>x.stone>=45,h:'需要灵石≥45',e:{life:30,stone:-45},flag:'changed'},{t:'转身离去',e:{life:-1,dao:2}}]})}],sect:[{id:'sect_escort',make:()=>({title:'宗门委托',text:'执事堂发布护送灵材的任务，沿途近日妖兽频现。',choices:[{t:'接下任务',e:{life:-3,stone:R(18,32),rep:5,hp:-R(0,4)}},{t:'留守山门',e:{life:-2,rep:2,cult:7}}]})},{id:'sect_library',make:()=>({title:'藏经阁值守',text:'长老命你整理一批旧经卷，其中几页残篇似乎无人留意。',choices:[{t:'认真整理',e:{life:-2,rep:4,wis:2}},{t:'参悟残篇',e:{life:-3,cult:R(9,15),wis:3},item:'经阁残篇'}]})},{id:'sect_duel',make:()=>({title:'同门切磋',text:'演武场上有人邀你切磋，周围已经聚起不少围观弟子。',choices:[{t:'应战',e:{life:-2,cult:R(6,12),rep:3,hp:-R(0,5)}},{t:'点到为止',e:{life:-1,dao:2,rep:2}}]})},{id:'sect_garden',make:()=>({title:'药园执勤',text:'药园灵虫暴增，若不及时处理，数月心血恐怕尽毁。',choices:[{t:'彻夜除虫',e:{life:-3,rep:4,stone:R(10,20),hp:-2}},{t:'调配驱虫散',ok:x=>x.wis>=38,h:'需要悟性≥38',e:{life:-2,rep:5,wis:2},item:'驱虫药方'}]})},{id:'sect_guest',make:()=>({title:'山门来客',text:'一名外宗修士携礼拜山，言语间不断打探宗门近况。',choices:[{t:'依礼接待',e:{life:-2,rep:4,stone:R(6,14)}},{t:'暗中试探',ok:x=>x.dao>=45,h:'需要道心≥45',e:{life:-2,wis:2,rep:2,cult:R(4,8)}}]})}]};let e=pickEvent(a,pools[a]||pools.train);scene(a==='encounter'?'奇遇剧情':a==='adventure'?'冒险剧情':a==='sect'?'宗门剧情':'修炼剧情',e.title,e.text);ev(e.title,e.text,e.choices)}function resolve(c){let logs=[];for(const[k,v]of Object.entries(c.e||{})){s[k]=(s[k]||0)+v;logs.push([`${{life:'寿命',cult:'修为',hp:'健康',dao:'道心',stone:'灵石',rep:'声望'}[k]||k} ${v>=0?'+':''}${v}`,v<0?'bad':''])}if(c.item){s.items.push(c.item);logs.push([`获得：${c.item}`,'special'])}if(c.flag){s.flags[c.flag]=1;logs.push(['命运轨迹发生改变','special'])}s.turn++;let cost=-(c.e?.life||0);s.age+=Math.max(cost,1);s.hp=C(s.hp,0,100);s.dao=C(s.dao,0,100);s.hist.push([s.age,`${$('panelTitle').textContent}：${c.t}`]);checkAch(logs);showLogs(logs);if(!checkEnd())save(1)}function showLogs(ls){$('event').classList.add('hidden');$('logs').classList.remove('hidden');$('logs').innerHTML=ls.map(x=>`<div class="delta ${x[1]}">${x[0]}</div>`).join('')+`<button id="next" class="btn primary">继续前行</button>`;$('next').onclick=()=>{render();scene('修仙纪事','仙途未尽','你收束心神，准备做出下一次选择。')}}function breakthrough(){let r=realm();if(s.realm>=12)return end('已臻化神');if(s.cult<r[1])return toast(`修为不足，还需${r[1]-s.cult}`);s.turn++;let chance=C(58+Math.floor(s.dao/8)+Math.floor(s.wis/12)+mod('br')-s.realm*2,25,94),logs=[];scene('破境天劫','雷云压顶',`你燃尽积累冲击${realms[s.realm+1][0]}。`);if(R(1,100)<=chance){let old=Math.floor(s.realm/3);s.realm++;s.stat.bs++;s.cult=0;s.dao=C(s.dao+4,0,100);s.hp=C(s.hp+12,0,100);logs.push([`突破成功：${realm()[0]}`,'special']);if(Math.floor(s.realm/3)>old){let gain=realm()[2]-s.max;s.max=realm()[2];s.life+=gain;logs.push([`寿命上限 +${gain}`,''])}else{s.life-=4;s.age+=4}if(s.realm===12){save(1);return end('化神飞升')}}else{s.stat.bf++;let loss=R(10,20);s.life-=loss;s.age+=loss;s.hp-=R(8,18);s.cult=Math.floor(s.cult*.55);logs.push(['突破失败，灵气反噬','bad'],[`寿命 -${loss}`,'bad'])}s.hist.push([s.age,logs[0][0]]);checkAch(logs);showLogs(logs);if(!checkEnd())save(1)}function unlock(a,logs){if(s.achs.includes(a))return;s.achs.push(a);logs.push([`解锁成就：${a}`,'special']);let m=meta();if(!m.achs.includes(a))m.achs.push(a);setMeta(m)}function checkAch(l){if(s.realm>=3)unlock('初窥仙途',l);if(s.realm>=6)unlock('金丹大道',l);if(s.realm>=9)unlock('元婴老怪',l);if(s.realm>=12)unlock('一朝化神',l);if(s.flags.changed)unlock('逆天改命',l);if(s.stat.bf>=3)unlock('九死一生',l);if(s.tal.some(t=>t[1]==='神品'))unlock('绝世妖孽',l)}function checkEnd(){if(s.hp<=0)return end('伤重坐化'),1;if(s.life<=0){if(s.flags.rebirth&&!s.flags.used){s.flags.used=1;s.stone=0;s.life=20;s.hp=45;toast('轮回之主逆转死劫');return 0}return end('寿元耗尽'),1}return 0}function title(reason){if(s.realm>=12)return s.flags.changed?'逆命天尊':'一朝化神';if(s.flags.changed)return'与天争命';if(s.realm>=9)return'一方老祖';if(s.realm>=6)return'金丹真人';if(s.rep>=25)return'宗门砥柱';return reason==='寿元耗尽'?'寿终道止':'身死道消'}function end(reason){s.ended=true;s.reason=reason;save(1);let t=title(reason),m=meta();m.runs++;m.best=Math.max(m.best,s.realm);if(!m.ends.includes(t))m.ends.push(t);setMeta(m);sheet('修仙生涯报告',`<div class="report"><small>修仙生涯录</small><h2>${s.name}</h2><b>${t} · ${reason}</b><div class="rgrid" style="margin-top:15px"><div>最终境界<br><b>${realm()[0]}</b></div><div>最终年龄<br><b>${s.age}岁</b></div><div>行动次数<br><b>${s.turn}</b></div><div>成就数量<br><b>${s.achs.length}</b></div></div><p>天赋：${s.tal.map(t=>t[0]).join('、')}<br>出身：${s.origin} · ${s.root}</p></div><button id="again" class="btn primary" style="width:100%;margin-top:12px">再活一世</button>`);setTimeout(()=>$('again').onclick=()=>{close();s=create();save(1);openGame()},0)}function sheet(t,h){$('sheetTitle').textContent=t;$('sheetBody').innerHTML=h;$('overlay').classList.remove('hidden')}function close(){$('overlay').classList.add('hidden')}function view(v){if(v==='history')sheet('此世历程',`<div class="list">${s.hist.slice().reverse().map(x=>`<div class="item"><small>${x[0]}岁</small><br>${x[1]}</div>`).join('')}</div>`);if(v==='stats')sheet('角色命盘',`<div class="list"><div class="item"><b>${s.name}</b><br><small>${s.origin} · ${s.root} · ${realm()[0]}</small></div>${[['寿命',`${s.life}/${s.max}`],['修为',`${s.cult}/${realm()[1]}`],['健康',s.hp],['道心',s.dao],['体魄',s.body],['悟性',s.wis],['气运',s.luck],['灵石',s.stone],['声望',s.rep]].map(x=>`<div class="item">${x[0]}：<b>${x[1]}</b></div>`).join('')}</div>`);if(v==='bag')sheet('乾坤袋',s.items.length?`<div class="list">${s.items.map(x=>`<div class="item">${x}</div>`).join('')}</div>`:'<div class="item">空空如也</div>');if(v==='ach')sheet('成就道印',`<div class="list">${['初窥仙途','金丹大道','元婴老怪','一朝化神','逆天改命','九死一生','绝世妖孽'].map(x=>`<div class="item" style="opacity:${s.achs.includes(x)?1:.4}">${s.achs.includes(x)?'◆':'◇'} ${x}</div>`).join('')}</div>`)}function codex(){let m=meta();sheet('轮回图鉴',`<div class="list"><div class="item">已完成轮回 <b>${m.runs}</b> 次<br><small>最高境界：${realms[m.best][0]}</small></div><div class="item"><b>永久成就</b><br><small>${m.achs.join('、')||'尚未解锁'}</small></div><div class="item"><b>结局图鉴</b><br><small>${m.ends.join('、')||'尚未解锁'}</small></div></div>`)}function openGame(){$('home').classList.add('hidden');$('game').classList.remove('hidden');render()}$('new').onclick=()=>{s=create();save(1);openGame()};$('cont').onclick=()=>{s=JSON.parse(localStorage.getItem(SK));openGame();if(s.ended)end(s.reason)};$('codex').onclick=codex;$('save').onclick=()=>save();$('menu').onclick=()=>sheet('游戏菜单','<button id="homeBtn" class="btn" style="width:100%">返回首页</button><button id="endBtn" class="btn" style="width:100%;margin-top:8px">结束本局</button>');$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.addEventListener('click',e=>{if(e.target.id==='homeBtn'){close();$('game').classList.add('hidden');$('home').classList.remove('hidden')}if(e.target.id==='endBtn'){close();end('主动结束此世')}});$('cont').classList.toggle('hidden',!localStorage.getItem(SK))})();
