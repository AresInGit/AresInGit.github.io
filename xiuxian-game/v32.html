<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1713"><title>问道长生 V3.2</title><style>html,body{margin:0;background:#07110e;color:#f1ead8;font-family:serif}#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}</style></head><body><div id="loading">正在载入问道长生 V3.2…</div><script>(async()=>{let h=await(await fetch('./v3.html?v=31',{cache:'no-store'})).text();const ps=[["ontent=\"分境界事件池、因果剧情链与道具联动的修仙人生小游戏\"><title>问道长生 V3.1<\/title><style>\n:root{--bg:#07110e;--p:#10231d;--t","ontent=\"分境界事件池、因果剧情链与道具联动的修仙人生小游戏\"><title>问道长生 V3.2<\/title><style>\n:root{--bg:#07110e;--p:#10231d;--t"],["hero\"><div class=\"seal\">道<\/div><div class=\"ey\">V3.1 · 奇遇硬去重<\/div><h1>问道长生<\/h1><p>同一境界的奇遇不会重复出现；旧奇遇退场后，将从数百种动态奇缘中继续生成新的因果。<\/p><div style=\"display:flex;gap:10px;justify-con","hero\"><div class=\"seal\">道<\/div><div class=\"ey\">V3.2 · 凡人流万象事件<\/div><h1>问道长生<\/h1><p>谨慎求生、坊市交易、炼丹制符、秘境夺宝、古阵远行与宗门博弈。事件坚持硬去重，并以原创因果链持续展开。<\/p><div style=\"display:flex;gap:10px;justify-con"],["兽精血':'可淬体。','百毒草':'可出售或用于毒道剧情。','残缺丹诀':'后续可能补全丹道传承。'};\nconst tierData={\ntrain:[\n[['松林吐纳','古松吞吐晨雾，草叶间","兽精血':'可淬体。','百毒草':'可出售或用于毒道剧情。','残缺丹诀':'后续可能补全丹道传承。','灵药种子':'稀有灵药种子，可开辟药圃长期培育。','染血储物袋':'来历不明的储物袋，残留追踪印记。','兽皮残图':'兽皮上画着残缺地形，似乎指向古修遗址。','敛息纱':'可遮掩部分气息，适合低调行事。','古传送阵盘':'记录古阵节点，可开启远行路线。','海外海图':'记录远海岛链与危险海域。','灵虫卵':'尚未孵化的异种灵虫，需要灵气与妖丹喂养。','傀儡核心':'古傀儡的动力核心，可尝试修复护法傀儡。','护法傀儡':'修复后的傀儡，可在破境和险境中护法。','遁行符':'高阶保命符箓，可在危险事件中脱身。','结婴心得':'前人结婴感悟，冲击元婴时自动提高成功率。','化神残简':'残缺的化神体悟，冲击化神时自动提高成功率。','空间晶砂':'空间裂隙中凝成的晶砂，与远距离传送有关。','千年灵草':'培育成熟的珍稀灵草，可炼药或直接服用。','异火火种':'性质稳定的天地异火，可用于丹道与炼器路线。','黑市令':'地下交易会的入场信物。'};\nconst tierData={\ntrain:[\n[['松林吐纳','古松吞吐晨雾，草叶间"],["眼之处。'],\n['天兆','天地灵气短暂失序，这并不像普通秘境，更像某种提前显现的征兆。']];\nfunction uniqueEncounter(g){\n const linked=new Set","眼之处。'],\n['天兆','天地灵气短暂失序，这并不像普通秘境，更像某种提前显现的征兆。']];\nconst storyEncounterData=[[[\"坊市暗摊\",\"坊市最偏僻的角落里，一名蒙面散修摆出几件不起眼旧物，却拒绝高声叫卖。\",\"trade\",\"黑市令\"],[\"外门药田\",\"药田边缘有一株无人认得的幼苗，管事只当它是杂草。\",\"herb\",\"灵药种子\"],[\"染血储物袋\",\"山道草丛里落着一只储物袋，袋口有未干的血迹，附近却不见尸体。\",\"loot\",\"染血储物袋\"],[\"散修遗骸\",\"偏僻石洞中盘坐着一具枯骨，衣袍早已腐朽，腰间却还有禁制波动。\",\"loot\",\"兽皮残图\"],[\"低阶拍卖会\",\"一场只对炼气修士开放的小拍卖会临时举行，压轴之物始终盖着黑布。\",\"auction\",\"敛息纱\"],[\"失踪采药队\",\"三名采药弟子进山后迟迟未归，只留下断裂的药锄和拖行痕迹。\",\"rescue\",null],[\"符箓铺试符\",\"坊市符铺缺人试验新制遁符，报酬不高，但失败后果由试符者自负。\",\"craft\",\"遁行符\"],[\"灵兽幼崽\",\"一只受伤的小兽躲在树洞里，颈间还挂着断裂的驭兽环。\",\"beast\",null],[\"废矿余脉\",\"废弃灵矿深处仍有微弱灵气，却有人故意把入口重新封死。\",\"resource\",null],[\"斗法余波\",\"你赶到时斗法已经结束，两名散修一死一逃，地上还留着破碎法器。\",\"loot\",\"染血储物袋\"],[\"旧宗门牌\",\"山涧石缝中卡着半块宗门木牌，纹样属于几十年前已经覆灭的小宗。\",\"clue\",\"兽皮残图\"],[\"雨夜敲门\",\"夜宿客栈时，有人连续敲了三次门，却始终不肯报上姓名。\",\"mystery\",null],[\"低阶禁制\",\"荒坡上有一圈肉眼难见的禁制，中心似乎埋着某件东西。\",\"formation\",\"兽皮残图\"],[\"灵药种子\",\"一名寿元将尽的老散修只卖一包种子，不卖丹药，也不解释来历。\",\"trade\",\"灵药种子\"],[\"小修聚会\",\"几名炼气散修约在城外交换修炼心得，每个人都刻意隐去真实来历。\",\"social\",null],[\"黑市换丹\",\"有人暗中收购妖丹与灵草，愿意用来历不明的增进修为丹药交换。\",\"trade\",\"黑市令\"],[\"尾随者\",\"离开坊市后，你察觉身后始终有一道若有若无的脚步声。\",\"ambush\",null],[\"雨夜避劫\",\"一道雷光劈中山林后，附近灵气突然暴涨，远处已有修士赶来。\",\"risk\",null],[\"山村妖祸\",\"山村连续有人失踪，村民只说夜里能听见屋顶有爪子刮过。\",\"combat\",null],[\"破阵残盘\",\"旧货摊上一块破铜盘毫不起眼，你却发现上面的纹路并非装饰。\",\"formation\",\"古传送阵盘\"]],[[\"筑基交换会\",\"十余名筑基修士在隐秘洞府交换物资，所有人入场前都更换了容貌。\",\"social\",\"黑市令\"],[\"洞府租赁\",\"坊市附近一处灵气不错的洞府突然低价转租，原主人却去向不明。\",\"mystery\",null],[\"炼丹师委托\",\"一名脾气古怪的炼丹师寻找可靠修士收集三种相克灵药。\",\"herb\",\"残缺丹诀\"],[\"古传送阵残角\",\"地下遗迹中露出半座古阵，阵纹结构与你见过的当代阵法完全不同。\",\"teleport\",\"古传送阵盘\"],[\"秘境名额\",\"宗门多出一个秘境名额，几名筑基弟子都在暗中争取。\",\"social\",null],[\"边境征召\",\"正邪两方在边境冲突升级，各宗开始征调筑基修士。\",\"war\",null],[\"傀儡工坊\",\"废弃工坊内堆满残破木甲，其中一具傀儡胸口仍有微弱光芒。\",\"craft\",\"傀儡核心\"],[\"驭虫散修\",\"一名沉默散修只用灵虫交易，不收灵石，并问你是否敢养一批未知虫卵。\",\"beast\",\"灵虫卵\"],[\"地下拍卖\",\"地下拍卖会不问来历，只认灵石，几件拍品明显带着血腥气。\",\"auction\",\"敛息纱\"],[\"灵药园争夺\",\"一座封闭多年的药园开启，几拨筑基修士同时赶到入口。\",\"herb\",\"灵药种子\"],[\"古兽皮地图\",\"老修士拿出一张兽皮地图，只说图上地方他年轻时不敢去。\",\"clue\",\"兽皮残图\"],[\"悬赏追杀\",\"坊市墙上突然多了一张悬赏画像，画中人竟与你数日前见过的修士极像。\",\"mystery\",null],[\"结丹心得残页\",\"一位筑基后期修士出售结丹失败后的心得，价格远低于市场。\",\"trade
