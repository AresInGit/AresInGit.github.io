function special(action){let out=[],push=(id,weight,make)=>{if(!s.flags['done_'+id])out.push({id,weight,make})};if(action==='encounter'&&grp()===0&&!s.flags.jade_seen)push('jade_start',7,()=>({title:'无主玉佩',text:'玉佩中的低语这次格外清晰：“若你愿听，我可以告诉你一处旧洞府。”',choices:[{t:'留下玉佩',e:{life:-2,luck:1},item:'神秘玉佩',set:{jade_seen:1}},{t:'封印后收起',e:{life:-1,dao:2},item:'神秘玉佩',set:{jade_seen:1}}]}));if(action==='train'&&has('神秘玉佩')&&s.flags.jade_seen&&!s.flags.soul_pact)push('soul_pact',12,()=>({title:'残魂苏醒',text:'修炼时玉佩发热，一缕残魂终于现身，自称曾是古宗门客卿。',choices:[{t:'与残魂立约',e:{life:-2,wis:3},set:{soul_pact:1},npc:['残魂',20]},{t:'保持距离',e:{life:-1,dao:3},set:{soul_pact:1},npc:['残魂',5]}]}));if(action==='adventure'&&s.flags.soul_pact&&!has('魂灯')&&grp()>=1)push('soul_lamp',10,()=>({title:'魂灯下落',text:'残魂认出一处废墟，那里可能埋着能稳定他神魂的魂灯。',choices:[{t:'替他寻灯',e:{life:-4,cult:14,hp:-R(0,6)},item:'魂灯',set:{soul_lamp:1}},{t:'暂不冒险',e:{life:-1,dao:1}}]}));if(action==='train'&&has('魂灯')&&s.flags.soul_pact&&!s.flags.soul_heritage)push('soul_heritage',15,()=>({title:'残魂传承',text:'魂灯点亮后，残魂把生前最完整的一段修炼心得交给了你。',choices:[{t:'接受传承',e:{life:-3,wis:6,dao:4,cult:25},set:{soul_heritage:1},consume:'魂灯',ach:'残魂传承'}]}));if(action==='adventure'&&!s.flags.sword_frag&&grp()<=1)push('sword_frag',5,()=>({title:'断剑入土',text:'山壁中插着一截断剑，靠近时你的心跳竟与剑鸣同频。',choices:[{t:'拔出残片',e:{life:-3,body:2},item:'断剑残片',set:{sword_frag:1}}]}));if(action==='train'&&has('断剑残片')&&!has('剑冢钥匙')&&grp()>=1)push('sword_key',9,()=>({title:'断剑共鸣',text:'残剑在夜里自行震鸣，剑身投出一幅古剑冢地图。',choices:[{t:'顺势悟剑',e:{life:-3,body:4,dao:4,cult:18},item:'剑冢钥匙',set:{sword_key:1}}]}));if(action==='encounter'&&has('剑冢钥匙')&&!s.flags.sword_tomb&&grp()>=2)push('sword_tomb',12,()=>({title:'古剑冢',text:'万柄残剑同时鸣响，你必须在剑意洪流中守住本心。',choices:[{t:'万剑问心',ok:x=>x.dao>=65,h:'需要道心≥65',e:{life:-5,body:6,dao:6,cult:28},set:{sword_tomb:1},consume:'剑冢钥匙',ach:'万剑问心'}]}));if(action==='train'&&s.flags.five&&!has('五行石')&&!s.flags.five_awake&&grp()>=1)push('five_stone',10,()=>({title:'五行异动',text:'杂乱灵根第一次没有互相冲突，反而形成微弱循环。',choices:[{t:'顺势凝练',e:{life:-4,wis:4,cult:18},item:'五行石',set:{five_cycle:1}}]}));if(action==='encounter'&&has('五行石')&&!s.flags.five_awake&&grp()>=2)push('five_awake',12,()=>({title:'五行归一',text:'五行石在金丹气机中化开，五种灵根第一次真正首尾相生。',choices:[{t:'逆转灵根',e:{life:-5,wis:7,dao:5,cult:24},set:{five_awake:1},consume:'五行石',ach:'五行归一'}]}));if(action==='encounter'&&!s.flags.changed&&(s.life<20||s.flags.short)&&s.luck>=35)push('life_clock',15,()=>({title:'逆命古钟',text:'古钟无风自鸣，每一声都像在丈量你剩余的寿元。',choices:[{t:'以道心叩钟',ok:x=>x.dao>=60,h:'需要道心≥60',e:{life:45,dao:-8},set:{changed:1},ach:'逆天改命'}]}));return out}
function pick(action){let sp=special(action);if(sp.length&&Math.random()<(sp.some(x=>x.weight>=12)?.68:.42)){let total=sp.reduce((n,e)=>n+e.weight,0),x=Math.random()*total,e=sp[0];for(const q of sp){x-=q.weight;if(x<=0){e=q;break}}remember('sp_'+e.id);s.flags['done_'+e.id]=1;return e.make()}return genericEvent(action)}function act(a){if(a==='break')return breakthrough();s.stats[a]=(s.stats[a]||0)+1;let e=pick(a);scene(a==='encounter'?`${groupNames[grp()]}奇遇`:a==='adventure'?`${groupNames[grp()]}历练`:a==='sect'?`${groupNames[grp()]}宗门`:`${groupNames[grp()]}修炼`,e.title,e.text);ev(e.title,e.text,e.choices)}function resolve(c){let logs=[];for(const[k,v]of Object.entries(c.e||{})){s[k]=(s[k]||0)+v;logs.push([`${({life:'寿命',cult:'修为',hp:'健康',dao:'道心',stone:'灵石',rep:'声望',body:'体魄',wis:'悟性',luck:'气运'})[k]||k} ${v>=0?'+':''}${v}`,v<0?'bad':''])}if(c.item){addItem(c.item);logs.push([`获得：${c.item}`,'special'])}if(c.consume&&delItem(c.consume))logs.push([`消耗：${c.consume}`,'bad']);if(c.set)Object.assign(s.flags,c.set);if(c.npc)s.npcs[c.npc[0]]=(s.npcs[c.npc[0]]||0)+c.npc[1];if(c.ach)unlock(c.ach,logs);s.turn++;s.age+=Math.max(-(c.e?.life||0),1);s.hp=C(s.hp,0,100);s.dao=C(s.dao,0,100);s.hist.push([s.age,`${$('panelTitle').textContent}：${c.t}`]);checkAch(logs);showLogs(logs);if(!checkEnd())save(1)}function showLogs(ls){$('event').classList.add('hidden');$('logs').classList.remove('hidden');$('logs').innerHTML=ls.map(x=>`<div class="delta ${x[1]}">${x[0]}</div>`).join('')+`<button id="next" class="btn primary">继续前行</button>`;$('next').onclick=()=>{render();scene('修仙纪事','仙途未尽',`如今你已在${groupNames[grp()]}境，天地间可触及的因果与往日不同。`)}}
function breakthrough(){let r=realm();if(s.realm>=12)return end('已臻化神');if(s.cult<r[1])return toast(`修为不足，还需${r[1]-s.cult}`);s.turn++;let bonus=0,logs=[];if(has('灵泉玉瓶')){delItem('灵泉玉瓶');bonus+=10;logs.push(['灵泉玉瓶：破境 +10%','special'])}if(s.realm===2&&has('筑基丹')){delItem('筑基丹');bonus+=18;logs.push(['筑基丹：筑基 +18%','special'])}let chance=C(58+Math.floor(s.dao/8)+Math.floor(s.wis/12)+mod('br')+bonus-s.realm*2,25,94),oldGroup=grp(),target=realms[s.realm+1][0];scene('破境天劫','雷云压顶',`你燃尽积累冲击${target}，成功率约 ${chance}%。`);if(R(1,100)<=chance){s.realm++;s.stats.bs++;s.cult=0;s.dao=C(s.dao+4,0,100);s.hp=C(s.hp+12,0,100);logs.push([`突破成功：${realm()[0]}`,'special']);if(grp()>oldGroup){let gain=realm()[2]-s.max;s.max=realm()[2];s.life+=gain;logs.push([`大境界跃迁：寿命上限 +${gain}`,'special']);s.hist.push([s.age,`踏入${groupNames[grp()]}境，旧日事件逐渐退场，新的事件池已开启。`])}else{s.life-=4;s.age+=4}if(s.realm===12){save(1);return end('化神飞升')}}else{s.stats.bf++;let loss=R(10,20);s.life-=loss;s.age+=loss;s.hp-=R(8,18);s.cult=Math.floor(s.cult*.55);logs.push(['突破失败，灵气反噬','bad'],[`寿命 -${loss}`,'bad'])}s.hist.push([s.age,logs.find(x=>x[0].includes('突破'))?.[0]||'破境']);checkAch(logs);showLogs(logs);if(!checkEnd())save(1)}function unlock(a,logs=[]){if(s.achs.includes(a))return;s.achs.push(a);logs.push([`解锁成就：${a}`,'special']);let m=meta();if(!m.achs.includes(a))m.achs.push(a);setMeta(m)}function checkAch(l){if(s.realm>=3)unlock('初窥仙途',l);if(s.realm>=6)unlock('金丹大道',l);if(s.realm>=9)unlock('元婴老怪',l);if(s.realm>=12)unlock('一朝化神',l);if(s.stats.bf>=3)unlock('九死一生',l);if(s.tal.some(t=>t[1]==='神品'))unlock('绝世妖孽',l)}function checkEnd(){if(s.hp<=0)return end('伤重坐化'),1;if(s.life<=0){if(s.flags.rebirth&&!s.flags.used){s.flags.used=1;s.stone=0;s.life=20;s.hp=45;toast('轮回之主逆转死劫');return 0}return end('寿元耗尽'),1}return 0}function title(reason){if(s.realm>=12)return s.flags.changed?'逆命天尊':s.flags.sword_tomb?'万剑尊者':s.flags.soul_heritage?'古魂道君':'一朝化神';if(s.realm>=9)return'一方老祖';if(s.realm>=6)return'金丹真人';return reason==='寿元耗尽'?'寿终道止':'身死道消'}function end(reason){s.ended=true;s.reason=reason;save(1);let t=title(reason),m=meta();m.runs++;m.best=Math.max(m.best,s.realm);if(!m.ends.includes(t))m.ends.push(t);setMeta(m);sheet('修仙生涯报告',`<div class="report"><small>修仙生涯录</small><h2>${s.name}</h2><b>${t} · ${reason}</b><div class="rgrid" style="margin-top:15px"><div>最终境界<br><b>${realm()[0]}</b></div><div>最终年龄<br><b>${s.age}岁</b></div><div>行动次数<br><b>${s.turn}</b></div><div>不同事件<br><b>${Object.keys(s.eventCounts).length}</b></div></div></div><button id="again" class="btn primary" style="width:100%;margin-top:12px">再活一世</button>`);setTimeout(()=>$('again').onclick=()=>{close();s=fresh();save(1);openGame()},0)}function itemAction(i){if(i==='延寿果'){delItem(i);s.life+=50;s.max+=20;toast('寿命 +50，上限 +20')}else if(i==='妖丹'){delItem(i);s.cult+=15;s.hp=C(s.hp-2,0,100);toast('修为 +15，健康 -2')}else if(i==='妖兽精血'){delItem(i);s.body+=3;s.hp=C(s.hp-4,0,100);toast('体魄 +3，健康 -4')}else return toast('剧情线索：满足条件后会自动开启后续事件');save(1);close();render()}function sheet(t,h){$('sheetTitle').textContent=t;$('sheetBody').innerHTML=h;$('overlay').classList.remove('hidden')}function close(){$('overlay').classList.add('hidden')}function view(v){if(v==='history')sheet('此世历程',`<div class="list">${s.hist.slice().reverse().map(x=>`<div class="item"><small>${x[0]}岁</small><br>${x[1]}</div>`).join('')}</div>`);if(v==='stats')sheet('角色命盘',`<div class="list">${[['境界',realm()[0]],['寿命',`${s.life}/${s.max}`],['修为',`${s.cult}/${realm()[1]}`],['健康',s.hp],['道心',s.dao],['体魄',s.body],['悟性',s.wis],['气运',s.luck],['灵石',s.stone],['声望',s.rep],['已见不同事件',Object.keys(s.eventCounts).length]].map(x=>`<div class="item">${x[0]}：<b>${x[1]}</b></div>`).join('')}</div>`);if(v==='bag'){let keys=Object.keys(s.items);sheet('乾坤袋',keys.length?`<div class="list">${keys.map(i=>`<div class="item"><b>${i} ×${s.items[i]}</b><br><small>${itemInfo[i]||'修仙物品'}</small><br><button class="btn" data-use="${i}" style="margin-top:8px">使用 / 查看因果</button></div>`).join('')}</div>`:'<div class="item">空空如也</div>')}if(v==='ach')sheet('成就道印',`<div class="list">${['初窥仙途','金丹大道','元婴老怪','一朝化神','逆天改命','九死一生','绝世妖孽','残魂传承','万剑问心','五行归一'].map(x=>`<div class="item" style="opacity:${s.achs.includes(x)?1:.4}">${s.achs.includes(x)?'◆':'◇'} ${x}</div>`).join('')}</div>`)}function codex(){let m=meta();sheet('轮回图鉴',`<div class="list"><div class="item">已完成轮回 <b>${m.runs}</b> 次<br><small>最高境界：${realms[m.best][0]}</small></div><div class="item"><b>永久成就</b><br><small>${m.achs.join('、')||'尚未解锁'}</small></div><div class="item"><b>结局图鉴</b><br><small>${m.ends.join('、')||'尚未解锁'}</small></div></div>`)}function openGame(){$('home').classList.add('hidden');$('game').classList.remove('hidden');render();scene('修仙纪事',`当前：${groupNames[grp()]}境`,`事件池已按${groupNames[grp()]}境更新；前期普通事件不会长期占据后期池。`)}$('new').onclick=()=>{s=fresh();save(1);openGame()};$('cont').onclick=()=>{s=migrate(JSON.parse(localStorage.getItem(SK)));openGame()};$('codex').onclick=codex;$('save').onclick=()=>save();$('menu').onclick=()=>sheet('游戏菜单','<button id="homeBtn" class="btn" style="width:100%">返回首页</button><button id="endBtn" class="btn" style="width:100%;margin-top:8px">结束本局</button>');$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.addEventListener('click',e=>{if(e.target.id==='homeBtn'){close();$('game').classList.add('hidden');$('home').classList.remove('hidden')}if(e.target.id==='endBtn'){close();end('主动结束此世')}if(e.target.dataset?.use)itemAction(e.target.dataset.use)});if(!localStorage.getItem(SK)&&localStorage.getItem(V2)){try{localStorage.setItem(SK,JSON.stringify(migrate(JSON.parse(localStorage.getItem(V2)))))}catch{}}$('cont').classList.toggle('hidden',!localStorage.getItem(SK));})();
</script></body></html>
